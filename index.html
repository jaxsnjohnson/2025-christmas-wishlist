<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jax's 2025 Christmas List</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Jax's personal Christmas wishlist for 2025. A whimsical list of items and stories.">
    <meta name="keywords" content="Christmas, Wishlist, Jax, 2025, Gifts, Presents, Holiday, CDs, Home, Technology, D&D, Hobbies, DVDs">
    
    <!-- Favicon (Present Box Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Font for whimsical titles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Add smooth scrolling and top padding for section jumps */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 2rem; /* 32px */
        }
        
        /* Apply the custom font */
        .font-christmas {
            font-family: 'Merriweather', serif;
        }
        
        /* Apply the standard font for body text */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Snow Animation Container */
        #snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* Individual Snowflake */
        .snowflake {
            position: absolute;
            top: -20px;
            /* Changed from white to be visible in light mode */
            background: #94a3b8; /* slate-400 */
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite, drift linear infinite;
        }
        
        /* Make snow white again in dark mode */
        .dark .snowflake {
            background: white;
        }

        /* Animation for falling */
        @keyframes fall {
            0% {
                transform: translateY(-20px);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh);
                opacity: 0.2;
            }
        }

        /* Animation for side-to-side drift (variation 1) */
        @keyframes drift-0 {
            0% { transform: translateX(0px); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(0px); }
        }

        /* Animation for side-to-side drift (variation 2) */
        @keyframes drift-1 {
            0% { transform: translateX(0px); }
            50% { transform: translateX(-40px); }
            100% { transform: translateX(0px); }
        }

        /* Styles for Collapsible Sidebar */
        #sidebar.collapsed {
            width: 5rem; /* 80px */
        }
        #sidebar.collapsed .nav-text {
            display: none;
        }
        #sidebar.collapsed .nav-icon {
            display: inline-block; /* Show icons */
            margin-left: 0;
        }
        #sidebar.collapsed a {
            text-align: center; /* Center the icons */
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }
        #sidebar:not(.collapsed) .nav-icon {
            display: none; /* Hide icons when not collapsed */
        }
        /* Button icons */
        #sidebar.collapsed .nav-icon-collapse-open { display: none; }
        #sidebar.collapsed .nav-icon-collapse-closed { display: inline-block; }
        #sidebar:not(.collapsed) .nav-icon-collapse-open { display: inline-block; }
        #sidebar:not(.collapsed) .nav-icon-collapse-closed { display: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">
    
    <!-- Snow container: snowflakes will be injected here by JS -->
    <div id="snow-container"></div>

    <!-- Main content: relative and z-10 ensure it's "above" the snow. -->
    <div class="relative z-10 container mx-auto max-w-6xl p-4 md:p-8">

        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-5xl md:text-7xl font-christmas text-red-600 dark:text-red-500">
                Jax's 2025 Christmas List
            </h1>
            
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                <!-- Sun Icon (Hidden by default, JS will show it) -->
                <svg id="theme-icon-light" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <!-- Moon Icon (Hidden by default, JS will show it) -->
                <svg id="theme-icon-dark" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </header>

        <!-- Christmas Countdown -->
        <div id="countdown" class="text-center mb-10 p-6 bg-white dark:bg-slate-800 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold font-christmas text-green-700 dark:text-green-500 mb-2">Christmas Countdown!</h2>
            <div id="countdown-timer" class="text-2xl md:text-4xl font-semibold text-gray-800 dark:text-gray-200" aria-live="polite">
                Calculating...
            </div>
        </div>

        <!-- Grid Container for Main Content and Nav -->
        <div class="lg:flex lg:gap-12">

            <!-- Sidebar Navigation -->
            <aside id="sidebar" class="hidden lg:block lg:w-64 transition-all duration-300 flex-shrink-0">
                <nav class="sticky top-8 space-y-3">
                    <h3 class="font-semibold text-lg text-gray-900 dark:text-white nav-text px-2">On this List</h3>
                    <a href="#cds" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">💿</span>
                        <span class="nav-text ml-2">CDs</span>
                    </a>
                    <a href="#dvds" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">📀</span>
                        <span class="nav-text ml-2">DVDs</span>
                    </a>
                    <a href="#for-the-home" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">🏠</span>
                        <span class="nav-text ml-2">For the Home</span>
                    </a>
                    <a href="#technology" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">💻</span>
                        <span class="nav-text ml-2">Technology</span>
                    </a>
                    <a href="#dnd" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">🐉</span>
                        <span class="nav-text ml-2">D&D</span>
                    </a>
                    <a href="#other-hobbies" class="block font-medium text-gray-600 dark:text-gray-400 hover:text-red-600 dark:hover:text-red-500 transition-colors py-2 px-2 rounded-lg">
                        <span class="nav-icon text-2xl">🎨</span>
                        <span class="nav-text ml-2">Other Hobbies</span>
                    </a>
                    
                    <!-- Collapse Button -->
                    <button id="collapse-btn" class="mt-6 w-full p-2 rounded-lg bg-gray-200 dark:bg-slate-700 hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors flex items-center justify-center text-gray-700 dark:text-gray-300">
                        <svg class="nav-icon-collapse-open h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                        </svg>
                        <svg class="nav-icon-collapse-closed h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                        <span class="nav-text ml-2">Collapse</span>
                    </button>
                </nav>
            </aside>

            <!-- Main Wishlist -->
            <main id="main-content" class="space-y-12 flex-grow"></main>
            
        </div> <!-- End Grid Container -->

        <!-- Footer -->
        <footer class="text-center mt-12 pt-8 border-t border-gray-300 dark:border-slate-700">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Wishing you a Merry Christmas! 🎄
            </p>
        </footer>

    </div>

    <script>
        // Wait for the DOM to be fully loaded before running scripts
        window.addEventListener('DOMContentLoaded', () => {
            
            // --- Theme Toggling Logic ---
            const themeToggleBtn = document.getElementById('theme-toggle');
            const lightIcon = document.getElementById('theme-icon-light');
            const darkIcon = document.getElementById('theme-icon-dark');

            function updateIconState() {
                if (document.documentElement.classList.contains('dark')) {
                    lightIcon.style.display = 'block';
                    darkIcon.style.display = 'none';
                } else {
                    lightIcon.style.display = 'none';
                    darkIcon.style.display = 'block';
                }
            }

            function setTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.theme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.theme = 'light';
                }
                updateIconState();
            }

            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let isDark;
            if (localStorage.theme === 'dark') isDark = true;
            else if (localStorage.theme === 'light') isDark = false;
            else isDark = prefersDark;
            setTheme(isDark);

            themeToggleBtn.addEventListener('click', () => {
                const currentlyIsDark = document.documentElement.classList.contains('dark');
                setTheme(!currentlyIsDark);
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!('theme' in localStorage)) {
                    setTheme(e.matches);
                }
            });

            // --- Christmas Countdown Logic ---
            function startCountdown() {
                const countdownElement = document.getElementById('countdown-timer');
                if (!countdownElement) return;

                const christmasDate = new Date('December 25, 2025 00:00:00').getTime();
                let interval;

                function updateTimer() {
                    const now = new Date().getTime();
                    const distance = christmasDate - now;

                    if (distance < 0) {
                        countdownElement.innerHTML = "It's Christmas! 🎄";
                        if (interval) clearInterval(interval);
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
                }

                interval = setInterval(updateTimer, 1000);
                updateTimer(); // run once immediately
            }

            startCountdown();

            // --- Collapsible Nav Logic ---
            const collapseBtn = document.getElementById('collapse-btn');
            const sidebar = document.getElementById('sidebar');

            if (collapseBtn && sidebar) {
                collapseBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                });
            }

            // --- Snow Creation Logic ---
            function createSnow() {
                const container = document.getElementById('snow-container');
                if (!container) return;
                
                const snowCount = 100;

                for (let i = 0; i < snowCount; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    
                    const size = Math.random() * 4 + 2;
                    flake.style.width = `${size}px`;
                    flake.style.height = `${size}px`;
                    
                    flake.style.left = `${Math.random() * 100}vw`;
                    
                    const fallDuration = Math.random() * 10 + 8;
                    const driftAnimation = `drift-${i % 2}`;
                    const driftDuration = Math.random() * 5 + 3;
                    
                    const fallDelay = `${Math.random() * -10}s`;
                    const driftDelay = `${Math.random() * -5}s`;

                    flake.style.animationName = `fall, ${driftAnimation}`;
                    flake.style.animationDuration = `${fallDuration}s, ${driftDuration}s`;
                    flake.style.animationDelay = `${fallDelay}, ${driftDelay}`;
                    
                    container.appendChild(flake);
                }
            }

            createSnow();

            // --- Wishlist Generation Logic ---
            async function generateWishlist() {
                const mainContent = document.getElementById('main-content');
                if (!mainContent) return;

                try {
                    const response = await fetch('presents.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();

                    // Clear any existing content (e.g., a loading message)
                    mainContent.innerHTML = '';

                    data.categories.forEach(category => {
                        // Create the section for the category
                        const section = document.createElement('section');
                        section.id = category.id;

                        // Create the category title
                        const title = document.createElement('h2');
                        title.className = `text-3xl font-bold font-christmas text-${category.colorClass}-700 dark:text-${category.colorClass}-500 mb-4 border-b-2 border-${category.colorClass}-300 dark:border-${category.colorClass}-700 pb-2`;
                        title.textContent = category.name;

                        // Create the grid container for the items
                        const grid = document.createElement('div');
                        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

                        category.items.forEach(item => {
                            // Create the link wrapping the item card
                            const link = document.createElement('a');
                            link.href = item.link;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.className = 'block transition-all duration-300 hover:shadow-2xl hover:scale-[1.02]';

                            // Create the article element for the card
                            const article = document.createElement('article');
                            article.className = 'bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden h-full';

                            // Create the image
                            const img = document.createElement('img');
                            img.src = item.image;
                            img.alt = item.name;
                            img.className = 'w-full h-48 object-cover';

                            // Create the content div
                            const contentDiv = document.createElement('div');
                            contentDiv.className = 'p-6';

                            // Create the item name
                            const itemName = document.createElement('h3');
                            itemName.className = 'text-xl font-semibold mb-2 text-gray-900 dark:text-white';
                            itemName.textContent = item.name;

                            // Create the tags container
                            const tagsDiv = document.createElement('div');
                            tagsDiv.className = 'flex flex-wrap gap-2 mb-4';

                            item.tags.forEach(tag => {
                                const tagSpan = document.createElement('span');
                                tagSpan.className = `text-xs font-semibold bg-${category.colorClass}-100 text-${category.colorClass}-800 dark:bg-${category.colorClass}-900 dark:text-${category.colorClass}-200 px-3 py-1 rounded-full`;
                                tagSpan.textContent = tag;
                                tagsDiv.appendChild(tagSpan);
                            });

                            // Create the story paragraph
                            const storyP = document.createElement('p');
                            storyP.className = 'text-sm';
                            storyP.innerHTML = `<strong>Story:</strong> ${item.story}`;

                            // Assemble the card
                            contentDiv.appendChild(itemName);
                            contentDiv.appendChild(tagsDiv);
                            contentDiv.appendChild(storyP);
                            article.appendChild(img);
                            article.appendChild(contentDiv);
                            link.appendChild(article);
                            grid.appendChild(link);
                        });

                        section.appendChild(title);
                        section.appendChild(grid);
                        mainContent.appendChild(section);
                    });

                } catch (error) {
                    mainContent.innerHTML = '<p class="text-center text-red-500">Could not load the wishlist. Please try again later.</p>';
                    console.error('Error fetching or parsing wishlist data:', error);
                }
            }

            generateWishlist();

        }); // End DOMContentLoaded
    </script>

</body>
</html>
